name: Generic artifact build pipeline

# Privacy rules baked into this workflow:
#   - No Actions artifact transfer; the private release receives assets directly.
#   - No releases or assets are ever created on THIS (public) repo.
#     Project bodies publish releases only to their private RELEASE_TARGET secret.
#   - builder.projects.json holds only opaque ids; names, release targets, private
#     credentials, and status Discussion ids live in per-project secrets.
#   - Status is appended to one private-repo Discussion. This workflow never writes
#     STATUS.md or calls the private repository Contents API.
#   - Payload is refreshed frequently from the source side; this just rebuilds.

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      project:
        description: Opaque project id to run, or all
        required: false
        default: all

permissions:
  actions: read
  contents: read

concurrency:
  group: artifact-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  project-list:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: projects
        shell: pwsh
        run: |
          $wanted = '${{ github.event.inputs.project }}'
          if ([string]::IsNullOrWhiteSpace($wanted)) { $wanted = 'all' }
          $config = Get-Content builder.projects.json -Raw | ConvertFrom-Json
          $projects = @($config.projects)
          if ($wanted -ne 'all') {
            $projects = @($projects | Where-Object { $_.id -eq $wanted })
          }
          if ($projects.Count -eq 0) { throw "No matching projects for '$wanted'." }
          $json = ConvertTo-Json @($projects) -Compress -Depth 10
          "projects=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build:
    name: build-${{ matrix.project.id }}
    needs: project-list
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.project-list.outputs.projects) }}
    runs-on: ${{ matrix.project.runner }}
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_BUNDLE_KEY: ${{ secrets[format('BUILD_BUNDLE_KEY_{0}', matrix.project.secret_suffix)] }}
      UPDATE_FEED_URL_A: ${{ secrets[format('UPDATE_FEED_URL_A_{0}', matrix.project.secret_suffix)] || secrets.UPDATE_FEED_URL_A }}
      UPDATE_FEED_URL_B: ${{ secrets[format('UPDATE_FEED_URL_B_{0}', matrix.project.secret_suffix)] || secrets.UPDATE_FEED_URL_B }}
      # Per-project credentials isolate accounts. The shared name is a temporary
      # migration fallback for builders published before suffixed secrets existed.
      PRIVATE_RELEASE_TOKEN: ${{ secrets[format('PRIVATE_RELEASE_TOKEN_{0}', matrix.project.secret_suffix)] || secrets.PRIVATE_RELEASE_TOKEN }}
      TARGET_RELEASE_REPO: ${{ secrets[format('RELEASE_TARGET_{0}', matrix.project.secret_suffix)] }}
      STATUS_DISCUSSION_ID: ${{ secrets[format('STATUS_DISCUSSION_ID_{0}', matrix.project.secret_suffix)] }}
      PROJECT_ID: ${{ matrix.project.id }}
      PROJECT_REV: ${{ matrix.project.rev }}
      BUILDER_SHA: ${{ github.sha }}
      BUILD_CACHE_DIR: ${{ github.workspace }}/.build-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Append build start to private Discussion
        continue-on-error: true
        run: |
          ./scripts/status.ps1 `
            -DiscussionId $env:STATUS_DISCUSSION_ID `
            -ProjectId $env:PROJECT_ID `
            -Revision $env:PROJECT_REV `
            -BuilderSha $env:BUILDER_SHA `
            -JobName "build-$env:PROJECT_ID" `
            -Workflow build `
            -Status in_progress

      - name: Prepare source workspace
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUILD_BUNDLE_KEY)) {
            throw "Missing key for $env:PROJECT_ID."
          }
          $root = "payloads/$env:PROJECT_ID"
          $payload = Join-Path $root 'payload.bin'
          if (-not (Test-Path -LiteralPath $payload)) {
            $parts = @(Get-ChildItem -LiteralPath $root -Filter 'payload.part.*' -File | Sort-Object Name)
            if ($parts.Count -eq 0) { throw "No payload found for $env:PROJECT_ID." }
            $out = [IO.File]::Open($payload, [IO.FileMode]::Create, [IO.FileAccess]::Write, [IO.FileShare]::None)
            try {
              foreach ($part in $parts) {
                $bytes = [IO.File]::ReadAllBytes($part.FullName)
                $out.Write($bytes, 0, $bytes.Length)
              }
            } finally {
              $out.Dispose()
            }
          }
          ./scripts/runtime.ps1 -In $payload -Out workspace.zip *> $null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = (Resolve-Path workspace.zip).Path
          $dest = Join-Path (Get-Location) 'source'
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $dest)

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_CACHE_DIR }}
          key: cache-${{ matrix.project.id }}-${{ runner.os }}-${{ hashFiles('source/deps/**/CMakeLists.txt', 'source/deps/**/*.cmake', 'source/deps/**/*.patch') }}
          restore-keys: |
            cache-${{ matrix.project.id }}-${{ runner.os }}-

      - name: Setup Java runtime
        if: runner.os == 'Windows'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android tools
        if: runner.os == 'Windows'
        uses: android-actions/setup-android@v3

      - name: Setup supported Node runtime
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Run project body
        run: |
          $script = "workflows/$env:PROJECT_ID.ps1"
          if (-not (Test-Path -LiteralPath $script)) { throw "Missing project body: $script" }
          $buildLog = Join-Path $env:RUNNER_TEMP 'epb-project-body.log'
          $safePhase = 'unknown'
          function Read-SafePhase {
            if (-not (Test-Path -LiteralPath $buildLog)) { return 'unknown' }
            $marker = Get-Content -LiteralPath $buildLog -ErrorAction SilentlyContinue |
              Select-String -Pattern '^EPB_SAFE_PHASE=[A-Za-z0-9_-]+$' |
              Select-Object -Last 1
            if ($marker) { return ($marker.Line -replace '^EPB_SAFE_PHASE=', '') }
            return 'unknown'
          }
          try {
            & $script *> $buildLog
            $safePhase = Read-SafePhase
            if ($LASTEXITCODE -ne 0) { throw 'opaque project body returned a failure code' }
          } catch {
            $safePhase = Read-SafePhase
            throw "Opaque project build phase failed at safe phase '$safePhase'."
          } finally {
            Remove-Item -LiteralPath $buildLog -Force -ErrorAction SilentlyContinue
          }

      - name: Append build terminal to private Discussion
        if: always()
        continue-on-error: true
        run: |
          ./scripts/status.ps1 `
            -DiscussionId $env:STATUS_DISCUSSION_ID `
            -ProjectId $env:PROJECT_ID `
            -Revision $env:PROJECT_REV `
            -BuilderSha $env:BUILDER_SHA `
            -JobName "build-$env:PROJECT_ID" `
            -Workflow build `
            -Status completed `
            -Conclusion '${{ job.status }}'

  publish-release:
    name: release-${{ matrix.project.id }}
    needs: [project-list, build]
    if: ${{ needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        project: ${{ fromJSON(needs.project-list.outputs.projects) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      PRIVATE_RELEASE_TOKEN: ${{ secrets[format('PRIVATE_RELEASE_TOKEN_{0}', matrix.project.secret_suffix)] || secrets.PRIVATE_RELEASE_TOKEN }}
      TARGET_RELEASE_REPO: ${{ secrets[format('RELEASE_TARGET_{0}', matrix.project.secret_suffix)] }}
      STATUS_DISCUSSION_ID: ${{ secrets[format('STATUS_DISCUSSION_ID_{0}', matrix.project.secret_suffix)] }}
      WORKFLOW_API_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      PROJECT_ID: ${{ matrix.project.id }}
      PROJECT_REV: ${{ matrix.project.rev }}
      BUILDER_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Append release start to private Discussion
        continue-on-error: true
        run: |
          ./scripts/status.ps1 `
            -DiscussionId $env:STATUS_DISCUSSION_ID `
            -ProjectId $env:PROJECT_ID `
            -Revision $env:PROJECT_REV `
            -BuilderSha $env:BUILDER_SHA `
            -JobName "release-$env:PROJECT_ID" `
            -Workflow release `
            -Status in_progress

      - name: Publish private release
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TARGET_RELEASE_REPO) -or
              [string]::IsNullOrWhiteSpace($env:PRIVATE_RELEASE_TOKEN)) { throw 'missing release publishing secret' }
          $runNumber = 0
          if (-not [int]::TryParse($env:GITHUB_RUN_NUMBER, [ref]$runNumber)) { $runNumber = 0 }
          $attempt = 1
          if (-not [int]::TryParse($env:GITHUB_RUN_ATTEMPT, [ref]$attempt)) { $attempt = 1 }
          $patch = 2000 + ($runNumber * 10) + [Math]::Max(0, $attempt - 1)
          if ($patch -gt 65535) { throw 'public builder run number exceeded Windows version range' }
          $tag = "v0.1.$patch"
          "EPB_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:GH_TOKEN = $env:PRIVATE_RELEASE_TOKEN
          $raw = gh release view $tag --repo $env:TARGET_RELEASE_REPO --json isDraft 2>&1
          if ($LASTEXITCODE -ne 0) { throw "missing release $tag" }
          $release = $raw | ConvertFrom-Json
          if (-not $release.isDraft) {
            Write-Host "release already published: $tag"
            return
          }
          $publishOutput = gh release edit $tag --repo $env:TARGET_RELEASE_REPO --draft=false --latest 2>&1
          if ($LASTEXITCODE -ne 0) { throw "release publish failed: $tag" }
          Write-Host "published: $tag"

      - name: Attach measured workflow timing
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EPB_RELEASE_TAG)) { throw 'release tag was not recorded' }
          if ([string]::IsNullOrWhiteSpace($env:WORKFLOW_API_TOKEN)) { throw 'workflow API credential unavailable' }
          $env:GH_TOKEN = $env:WORKFLOW_API_TOKEN
          $firstJob = @()
          $releaseJob = @()
          $publicationStep = @()
          $timingReady = $false
          for ($timingAttempt = 1; $timingAttempt -le 24; $timingAttempt++) {
            $jobsRaw = @(gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100" 2>&1 |
              ForEach-Object { "$_" })
            if ($LASTEXITCODE -eq 0) {
              try {
                $jobsDocument = (($jobsRaw -join [Environment]::NewLine) | ConvertFrom-Json)
                $jobs = @($jobsDocument.jobs)
                $firstJob = @($jobs |
                  Where-Object { -not [string]::IsNullOrWhiteSpace($_.started_at) } |
                  Sort-Object { [DateTimeOffset]::Parse($_.started_at) } |
                  Select-Object -First 1)
                $releaseJob = @($jobs |
                  Where-Object { $_.name -like "release-$env:PROJECT_ID*" } |
                  Select-Object -First 1)
                $publicationStep = @($releaseJob.steps |
                  Where-Object { $_.name -eq 'Publish private release' -and -not [string]::IsNullOrWhiteSpace($_.completed_at) } |
                  Select-Object -Last 1)
                $timingReady = $firstJob.Count -gt 0 -and $releaseJob.Count -gt 0 -and $publicationStep.Count -gt 0
              } catch {
                $timingReady = $false
              }
            }
            if ($timingReady) { break }
            if ($timingAttempt -lt 24) { Start-Sleep -Seconds 5 }
          }
          if (-not $timingReady) { throw 'workflow timing evidence is incomplete after bounded retries' }
          try {
            $startedAt = ([DateTimeOffset]::Parse($firstJob[0].started_at)).ToUniversalTime()
            $completedAt = ([DateTimeOffset]::Parse($publicationStep[0].completed_at)).ToUniversalTime()
          } catch { throw 'workflow timing evidence contains invalid timestamps' }
          $duration = $completedAt - $startedAt
          if ($duration.TotalSeconds -lt 0) { throw 'workflow timing evidence is reversed' }
          $durationText = '{0:00}:{1:00}:{2:00}' -f [int][Math]::Floor($duration.TotalHours), $duration.Minutes, $duration.Seconds

          $env:GH_TOKEN = $env:PRIVATE_RELEASE_TOKEN
          $releaseRaw = @(gh release view $env:EPB_RELEASE_TAG --repo $env:TARGET_RELEASE_REPO --json body 2>&1 |
            ForEach-Object { "$_" })
          if ($LASTEXITCODE -ne 0) { throw 'private release notes lookup failed' }
          try { $release = (($releaseRaw -join [Environment]::NewLine) | ConvertFrom-Json) }
          catch { throw 'private release notes response was invalid' }
          $marker = '<!-- epb-workflow-timing:v1 -->'
          $existingBody = [string]$release.body
          $existingBody = [regex]::Replace($existingBody, '(?s)\r?\n?<!-- epb-workflow-timing:v1 -->.*$', '').TrimEnd()
          $timing = @(
            $marker
            '### Workflow timing / 流程時間'
            ''
            "- Workflow started / 流程開始: $($startedAt.ToString("yyyy-MM-dd'T'HH:mm:ss'Z'"))"
            "- Workflow completed / 流程完成: $($completedAt.ToString("yyyy-MM-dd'T'HH:mm:ss'Z'"))"
            "- Workflow duration / 流程用時: ``$durationText``"
            '- Measured from the first job `startedAt` to the completed `Publish private release` step.'
            '- 由第一個工作嘅 `startedAt` 計到完成 `Publish private release` 步驟，唔係估時間。'
          ) -join "`n"
          $updatedBody = if ([string]::IsNullOrWhiteSpace($existingBody)) { $timing } else { "$existingBody`n`n$timing" }
          $editRaw = @(gh release edit $env:EPB_RELEASE_TAG --repo $env:TARGET_RELEASE_REPO --notes $updatedBody 2>&1 |
            ForEach-Object { "$_" })
          if ($LASTEXITCODE -ne 0) { throw 'private release timing update failed' }
          Write-Host "Workflow timing recorded: $($startedAt.ToString('o')) -> $($completedAt.ToString('o')) ($durationText)."

      - name: Append release terminal to private Discussion
        if: always()
        continue-on-error: true
        run: |
          ./scripts/status.ps1 `
            -DiscussionId $env:STATUS_DISCUSSION_ID `
            -ProjectId $env:PROJECT_ID `
            -Revision $env:PROJECT_REV `
            -BuilderSha $env:BUILDER_SHA `
            -JobName "release-$env:PROJECT_ID" `
            -Workflow release `
            -Status completed `
            -Conclusion '${{ job.status }}' `
            -Release $env:EPB_RELEASE_TAG

  publish-release-skipped:
    needs: [project-list, build]
    if: ${{ always() && needs.project-list.result == 'success' && needs.build.result != 'success' }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.project-list.outputs.projects) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    env:
      PRIVATE_RELEASE_TOKEN: ${{ secrets[format('PRIVATE_RELEASE_TOKEN_{0}', matrix.project.secret_suffix)] || secrets.PRIVATE_RELEASE_TOKEN }}
      STATUS_DISCUSSION_ID: ${{ secrets[format('STATUS_DISCUSSION_ID_{0}', matrix.project.secret_suffix)] }}
      PROJECT_ID: ${{ matrix.project.id }}
      PROJECT_REV: ${{ matrix.project.rev }}
      BUILDER_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Append skipped release to private Discussion
        if: always()
        continue-on-error: true
        run: |
          ./scripts/status.ps1 `
            -DiscussionId $env:STATUS_DISCUSSION_ID `
            -ProjectId $env:PROJECT_ID `
            -Revision $env:PROJECT_REV `
            -BuilderSha $env:BUILDER_SHA `
            -JobName "release-$env:PROJECT_ID" `
            -Workflow release `
            -Status skipped `
            -Conclusion '${{ needs.build.result }}'
