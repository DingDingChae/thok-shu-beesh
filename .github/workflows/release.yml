name: Generic artifact build pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  project-list:
    runs-on: windows-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: projects
        shell: pwsh
        run: |
          $config = Get-Content builder.projects.json -Raw | ConvertFrom-Json
          $projects = @($config.projects)
          if ($projects.Count -eq 0) { throw 'No projects are configured.' }
          $json = ConvertTo-Json @($projects) -Compress -Depth 10
          "projects=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  build:
    name: build-${{ matrix.project.id }}
    needs: project-list
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.project-list.outputs.projects) }}
    runs-on: ${{ matrix.project.runner }}
    defaults:
      run:
        shell: pwsh
    env:
      PROJECT_ID: ${{ matrix.project.id }}
      PROJECT_REV: ${{ matrix.project.rev }}
      BUILDER_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Bootstrap Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/bootstrap-windows.ps1

      - name: Append build start to private Discussion
        continue-on-error: true
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets[format('PRIVATE_RELEASE_TOKEN_{0}', matrix.project.secret_suffix)] || secrets.PRIVATE_RELEASE_TOKEN }}
          STATUS_DISCUSSION_ID: ${{ secrets[format('STATUS_DISCUSSION_ID_{0}', matrix.project.secret_suffix)] }}
        run: |
          ./scripts/status.ps1 `
            -DiscussionId $env:STATUS_DISCUSSION_ID `
            -ProjectId $env:PROJECT_ID `
            -Revision $env:PROJECT_REV `
            -BuilderSha $env:BUILDER_SHA `
            -JobName "build-$env:PROJECT_ID" `
            -Workflow build `
            -Status in_progress

      - name: Prepare source workspace
        env:
          BUILD_BUNDLE_KEY: ${{ secrets[format('BUILD_BUNDLE_KEY_{0}', matrix.project.secret_suffix)] }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUILD_BUNDLE_KEY)) {
            throw "Missing key for $env:PROJECT_ID."
          }
          $root = "payloads/$env:PROJECT_ID"
          $payload = Join-Path $root 'payload.bin'
          if (-not (Test-Path -LiteralPath $payload)) {
            $parts = @(Get-ChildItem -LiteralPath $root -Filter 'payload.part.*' -File | Sort-Object Name)
            if ($parts.Count -eq 0) { throw "No payload found for $env:PROJECT_ID." }
            $out = [IO.File]::Open($payload, [IO.FileMode]::Create, [IO.FileAccess]::Write, [IO.FileShare]::None)
            try {
              foreach ($part in $parts) {
                $bytes = [IO.File]::ReadAllBytes($part.FullName)
                $out.Write($bytes, 0, $bytes.Length)
              }
            } finally {
              $out.Dispose()
            }
          }
          ./scripts/runtime.ps1 -In $payload -Out workspace.zip *> $null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = (Resolve-Path workspace.zip).Path
          $dest = Join-Path (Get-Location) 'source'
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zip, $dest)

      - name: Run project body
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets[format('PRIVATE_RELEASE_TOKEN_{0}', matrix.project.secret_suffix)] || secrets.PRIVATE_RELEASE_TOKEN }}
          TARGET_RELEASE_REPO: ${{ secrets[format('RELEASE_TARGET_{0}', matrix.project.secret_suffix)] }}
          SOURCE_COMMIT: ${{ secrets[format('SOURCE_COMMIT_{0}', matrix.project.secret_suffix)] }}
        run: |
          $script = "source/build/opaque/$env:PROJECT_ID.ps1"
          if (-not (Test-Path -LiteralPath $script)) {
            throw "Missing project body: $script"
          }
          & $script

      - name: Remove decrypted workspace
        if: always()
        run: |
          foreach ($target in @('workspace.zip', 'source')) {
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }
          $payload = Join-Path "payloads/$env:PROJECT_ID" 'payload.bin'
          if (Test-Path -LiteralPath $payload) {
            Remove-Item -LiteralPath $payload -Force
          }

      - name: Append build terminal to private Discussion
        if: always()
        continue-on-error: true
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets[format('PRIVATE_RELEASE_TOKEN_{0}', matrix.project.secret_suffix)] || secrets.PRIVATE_RELEASE_TOKEN }}
          STATUS_DISCUSSION_ID: ${{ secrets[format('STATUS_DISCUSSION_ID_{0}', matrix.project.secret_suffix)] }}
        run: |
          ./scripts/status.ps1 `
            -DiscussionId $env:STATUS_DISCUSSION_ID `
            -ProjectId $env:PROJECT_ID `
            -Revision $env:PROJECT_REV `
            -BuilderSha $env:BUILDER_SHA `
            -JobName "build-$env:PROJECT_ID" `
            -Workflow build `
            -Status completed `
            -Conclusion '${{ job.status }}'

  publish-release:
    needs: [project-list, build]
    if: ${{ success() }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PROJECT_ID: p06ecfac88a9
      BUILDER_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Append release start to private Discussion
        continue-on-error: true
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN_P06ECFAC88A9 || secrets.PRIVATE_RELEASE_TOKEN }}
          STATUS_DISCUSSION_ID: ${{ secrets.STATUS_DISCUSSION_ID_P06ECFAC88A9 }}
          PROJECT_REV: ${{ secrets.SOURCE_COMMIT_P06ECFAC88A9 }}
        run: |
          ./scripts/status.ps1 `
            -DiscussionId $env:STATUS_DISCUSSION_ID `
            -ProjectId $env:PROJECT_ID `
            -Revision $env:PROJECT_REV `
            -BuilderSha $env:BUILDER_SHA `
            -JobName "release-$env:PROJECT_ID" `
            -Workflow release `
            -Status in_progress

      - name: Publish private release
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN_P06ECFAC88A9 || secrets.PRIVATE_RELEASE_TOKEN }}
          TARGET_RELEASE_REPO: ${{ secrets.RELEASE_TARGET_P06ECFAC88A9 }}
          SOURCE_COMMIT: ${{ secrets.SOURCE_COMMIT_P06ECFAC88A9 }}
          RELEASE_ASSET_MANIFEST: ${{ secrets.RELEASE_ASSET_MANIFEST_P06ECFAC88A9 }}
          WORKFLOW_API_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TARGET_RELEASE_REPO) -or
              [string]::IsNullOrWhiteSpace($env:PRIVATE_RELEASE_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:RELEASE_ASSET_MANIFEST) -or
              [string]::IsNullOrWhiteSpace($env:WORKFLOW_API_TOKEN)) {
            throw 'missing release publishing secret'
          }
          $runNumber = 0
          if (-not [int]::TryParse($env:GITHUB_RUN_NUMBER, [ref]$runNumber) -or
              $runNumber -lt 1 -or $runNumber -gt 65535) {
            throw 'builder run number is outside the supported version range'
          }
          $version = "0.2.$runNumber"
          $tag = "v$version"
          "EPB_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $marker = "opaque-run:$env:GITHUB_RUN_ID"
          if ($env:SOURCE_COMMIT -notmatch '^[0-9a-f]{40,64}$') {
            throw 'missing source revision binding'
          }

          $env:GH_TOKEN = $env:WORKFLOW_API_TOKEN
          $jobRaw = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs?per_page=100" 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'workflow timing query failed' }
          $jobs = @((($jobRaw | ConvertFrom-Json).jobs) | Where-Object { -not [string]::IsNullOrWhiteSpace($_.started_at) })
          if ($jobs.Count -eq 0) { throw 'workflow start time is unavailable' }
          $workflowStarted = ($jobs | ForEach-Object { [DateTimeOffset]::Parse($_.started_at).ToUniversalTime() } | Sort-Object | Select-Object -First 1)

          $env:GH_TOKEN = $env:PRIVATE_RELEASE_TOKEN
          $filter = ".[] | select(.tag_name == `"$tag`") | {id: .id, isDraft: .draft, body: .body, assets: .assets, targetCommitish: .target_commitish, publishedAt: .published_at, tagName: .tag_name}"
          $raw = gh api --paginate "repos/$env:TARGET_RELEASE_REPO/releases?per_page=100" --jq $filter 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($raw -join "`n"))) {
            throw 'required draft release is missing'
          }
          try { $release = (($raw -join "`n") | ConvertFrom-Json -Depth 20) }
          catch { throw 'release inventory response was invalid' }
          if (@($release).Count -ne 1) { throw 'release inventory returned an ambiguous tag' }
          $release = @($release)[0]
          if (-not ([string]$release.body).Contains($marker)) {
            throw 'release provenance does not match this run'
          }
          try {
            $expectedNames = @($env:RELEASE_ASSET_MANIFEST | ConvertFrom-Json | ForEach-Object {
              ([string]$_).Replace('{version}', $version)
            })
          } catch { throw 'required release asset manifest secret is invalid' }
          if ($expectedNames.Count -ne 5 -or @($expectedNames | Select-Object -Unique).Count -ne 5) {
            throw 'required release asset manifest secret is incomplete'
          }
          $actualNames = @($release.assets | ForEach-Object { [string]$_.name })
          $assetDiff = @(Compare-Object -ReferenceObject $expectedNames -DifferenceObject $actualNames -CaseSensitive)
          if ($actualNames.Count -ne $expectedNames.Count -or $assetDiff.Count -gt 0 -or
              @($release.assets | Where-Object size -le 0).Count -gt 0) {
            throw 'required release asset manifest is invalid'
          }
          if (-not ([string]$release.body).Contains($env:SOURCE_COMMIT) -or
              -not ([string]$release.body).Contains('## Repository line count')) {
            throw 'release evidence is incomplete'
          }
          if ([string]$release.targetCommitish -ne $env:SOURCE_COMMIT) {
            throw 'release target does not match the bound source revision'
          }

          $releaseId = [int64]$release.id
          if ($release.isDraft) {
            gh api --method PATCH "repos/$env:TARGET_RELEASE_REPO/releases/$releaseId" -F draft=false *> $null
            if ($LASTEXITCODE -ne 0) { throw 'release publish failed' }
          }
          $publishedRaw = gh api "repos/$env:TARGET_RELEASE_REPO/releases/$releaseId" 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'published release verification failed' }
          $published = $publishedRaw | ConvertFrom-Json -Depth 20
          if ($published.draft -or [string]::IsNullOrWhiteSpace([string]$published.published_at)) {
            throw 'published release timestamp is unavailable'
          }
          $timingMarker = '<!-- workflow-timing:v1 -->'
          $baseBody = [regex]::Replace([string]$published.body, '(?s)\r?\n?<!-- workflow-timing:v1 -->.*$', '').TrimEnd()

          $inventoryRaw = gh api --paginate "repos/$env:TARGET_RELEASE_REPO/releases?per_page=100" `
            --jq '.[] | select(.draft == false and .prerelease == false) | {id: .id, tagName: .tag_name}'
          if ($LASTEXITCODE -ne 0) { throw 'release ordering query failed' }
          $highestId = $null
          $highestVersion = $null
          foreach ($line in @($inventoryRaw)) {
            if ([string]::IsNullOrWhiteSpace([string]$line)) { continue }
            $candidate = $line | ConvertFrom-Json
            $parsed = $null
            if ([string]$candidate.tagName -match '^v(.+)$' -and
                [version]::TryParse($Matches[1], [ref]$parsed) -and
                ($null -eq $highestVersion -or $parsed -gt $highestVersion)) {
              $highestId = [int64]$candidate.id
              $highestVersion = $parsed
            }
          }
          if ($null -eq $highestId) { throw 'no published semantic release was found' }
          gh api --method PATCH "repos/$env:TARGET_RELEASE_REPO/releases/$highestId" -f make_latest=true *> $null
          if ($LASTEXITCODE -ne 0) { throw 'latest release selection failed' }

          # This timestamp is captured only after every other release mutation. Publishing
          # the timing notes below is the final release-publication step for this workflow.
          $workflowCompleted = [DateTimeOffset]::UtcNow
          $elapsed = $workflowCompleted - $workflowStarted
          if ($elapsed.TotalSeconds -lt 0) { throw 'workflow timing evidence is reversed' }
          $duration = '{0:00}:{1:00}:{2:00}' -f [math]::Floor($elapsed.TotalHours), $elapsed.Minutes, $elapsed.Seconds
          $timing = @"

          $timingMarker
          ## Workflow timing

          - Workflow started: ``$($workflowStarted.ToString('yyyy-MM-ddTHH:mm:ssZ'))``
          - Workflow completed: ``$($workflowCompleted.ToString('yyyy-MM-ddTHH:mm:ssZ'))``
          - Workflow duration: ``$duration``
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'private-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $baseBody + "`n" + $timing.Trim() + "`n", [Text.UTF8Encoding]::new($false))
          gh api --method PATCH "repos/$env:TARGET_RELEASE_REPO/releases/$releaseId" -F "body=@$notesPath" *> $null
          if ($LASTEXITCODE -ne 0) { throw 'release timing publication failed' }

          $finalRaw = gh api "repos/$env:TARGET_RELEASE_REPO/releases/$releaseId" 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'final release verification failed' }
          $final = $finalRaw | ConvertFrom-Json -Depth 20
          $startedLine = "- Workflow started: ``$($workflowStarted.ToString('yyyy-MM-ddTHH:mm:ssZ'))``"
          $completedLine = "- Workflow completed: ``$($workflowCompleted.ToString('yyyy-MM-ddTHH:mm:ssZ'))``"
          $durationLine = "- Workflow duration: ``$duration``"
          if ($final.draft -or [string]$final.published_at -ne [string]$published.published_at -or
              -not ([string]$final.body).Contains($startedLine) -or
              -not ([string]$final.body).Contains($completedLine) -or
              -not ([string]$final.body).Contains($durationLine)) {
            throw 'final release timing evidence is incomplete'
          }

          Write-Host 'published'

      - name: Append release terminal to private Discussion
        if: always()
        continue-on-error: true
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN_P06ECFAC88A9 || secrets.PRIVATE_RELEASE_TOKEN }}
          STATUS_DISCUSSION_ID: ${{ secrets.STATUS_DISCUSSION_ID_P06ECFAC88A9 }}
          PROJECT_REV: ${{ secrets.SOURCE_COMMIT_P06ECFAC88A9 }}
        run: |
          ./scripts/status.ps1 `
            -DiscussionId $env:STATUS_DISCUSSION_ID `
            -ProjectId $env:PROJECT_ID `
            -Revision $env:PROJECT_REV `
            -BuilderSha $env:BUILDER_SHA `
            -JobName "release-$env:PROJECT_ID" `
            -Workflow release `
            -Status completed `
            -Conclusion '${{ job.status }}' `
            -Release $env:EPB_RELEASE_TAG

  publish-release-skipped:
    needs: [project-list, build]
    if: ${{ always() && needs.project-list.result == 'success' && needs.build.result != 'success' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PROJECT_ID: p06ecfac88a9
      BUILDER_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Append skipped release to private Discussion
        if: always()
        continue-on-error: true
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN_P06ECFAC88A9 || secrets.PRIVATE_RELEASE_TOKEN }}
          STATUS_DISCUSSION_ID: ${{ secrets.STATUS_DISCUSSION_ID_P06ECFAC88A9 }}
          PROJECT_REV: ${{ secrets.SOURCE_COMMIT_P06ECFAC88A9 }}
        run: |
          ./scripts/status.ps1 `
            -DiscussionId $env:STATUS_DISCUSSION_ID `
            -ProjectId $env:PROJECT_ID `
            -Revision $env:PROJECT_REV `
            -BuilderSha $env:BUILDER_SHA `
            -JobName "release-$env:PROJECT_ID" `
            -Workflow release `
            -Status skipped `
            -Conclusion '${{ needs.build.result }}'

  cleanup-failed-release:
    needs: [project-list, build, publish-release]
    if: ${{ always() && needs.project-list.result == 'success' && needs.publish-release.result != 'success' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Remove incomplete private release
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN_P06ECFAC88A9 || secrets.PRIVATE_RELEASE_TOKEN }}
          TARGET_RELEASE_REPO: ${{ secrets.RELEASE_TARGET_P06ECFAC88A9 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TARGET_RELEASE_REPO) -or
              [string]::IsNullOrWhiteSpace($env:PRIVATE_RELEASE_TOKEN)) {
            throw 'missing release cleanup secret'
          }
          $runNumber = 0
          if (-not [int]::TryParse($env:GITHUB_RUN_NUMBER, [ref]$runNumber) -or
              $runNumber -lt 1 -or $runNumber -gt 65535) {
            throw 'builder run number is outside the supported version range'
          }
          $tag = "v0.2.$runNumber"
          $marker = "opaque-run:$env:GITHUB_RUN_ID"
          $env:GH_TOKEN = $env:PRIVATE_RELEASE_TOKEN
          $filter = ".[] | select(.tag_name == `"$tag`") | {id: .id, isDraft: .draft, body: .body, tagName: .tag_name}"
          $raw = gh api --paginate "repos/$env:TARGET_RELEASE_REPO/releases?per_page=100" --jq $filter 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'release cleanup query failed' }
          if ([string]::IsNullOrWhiteSpace(($raw -join "`n"))) { return }
          $release = (($raw -join "`n") | ConvertFrom-Json)
          if (@($release).Count -ne 1) { throw 'release cleanup inventory was ambiguous' }
          $release = @($release)[0]
          if (([string]$release.body).Contains($marker)) {
            if ($release.isDraft) {
              gh api --method DELETE "repos/$env:TARGET_RELEASE_REPO/releases/$([int64]$release.id)" *> $null
            } else {
              gh release delete $tag --repo $env:TARGET_RELEASE_REPO --cleanup-tag --yes *> $null
            }
            if ($LASTEXITCODE -ne 0) { throw 'incomplete release and tag cleanup failed' }
          }
